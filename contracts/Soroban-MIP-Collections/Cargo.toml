[workspace]
resolver = "2"
members = ["contracts/mip-collection", "contracts/mip-registry"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
soroban-sdk = "26.1.0"
stellar-tokens = "0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
